# A CV base for one track. Copy it per track (cv/data-science.yml) and per language
# (cv/data-science.fr.yml); point focus.tracks[].cv at the English or default one.
# `jobveyra tailor <job>` copies the right base into the job's package for you to adapt.
#
# Every number, date, employer and degree here must also be in your fact base (cv/master.md):
# `jobveyra build` rejects anything that is not.
#
# Text may use **bold** and *italic*. Write date ranges with a plain hyphen; the template
# spaces them the way ATS date parsers read.

lang: en

# header: defaults come from `candidate` in jobveyra.yml; override any field here.
# header:
#   city: Lisbon, Portugal
#   links: [linkedin.com/in/you, github.com/you]

order: [experience, education, projects, publications, skills, awards]

