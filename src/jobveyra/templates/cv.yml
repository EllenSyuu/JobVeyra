      - Designed and analysed 40 pricing experiments with the product team.
  - org: Example University
    title: Research Assistant
    city: Lisbon
    start: Sep 2021
    end: Dec 2022
    bullets:
      - Wrote an open-source package for survival models, used in 3 published studies.

education:
